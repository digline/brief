[project]
name = "brief"
version = "0.1.0"
description = "A morning digest of AI sources, judged by Haiku, with the evaluation suite that keeps the judge honest."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=1.0.0",
    "feedparser>=6.0.14",
    # `BriefJudge` renders the same template the suite does, and is built on
    # `digline.targets.JudgeBase`, so the application depends on digline for
    # that — not only the tests.
    "digline>=0.8,<0.9",
    # No longer test-only: `brief.BriefJudge` is a `digline.targets.JudgeBase`
    # priced from the plugin's `ANTHROPIC_PRICING`, so the application imports
    # the provider package too — not only the suite.
    "digline-anthropic>=0.4,<0.5",
]

# Not a dependency of the digest. `digline-mcp` pulls `mcp>=2.2,<3`, and the
# morning run has no business carrying an MCP stack — but `.mcp.json` names
# `uv run digline-mcp`, so it has to be installed somewhere. A dev group is
# that somewhere. Note `uv sync` installs it by default, CI included; that is
# the price of the server being one command away rather than one README
# paragraph away.
[dependency-groups]
dev = [
    "digline-mcp>=0.1.1,<0.2",
]
