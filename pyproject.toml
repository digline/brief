[project]
name = "brief"
version = "0.1.0"
description = "A morning digest of AI sources, judged by Haiku, with the evaluation suite that keeps the judge honest."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=1.0.0",
    "feedparser>=6.0.14",
    # `BriefJudge` renders the same template the suite does, and is built on
    # `digline.targets.JudgeBase`, so the application depends on digline for
    # that — not only the tests.
    #
    # The floor is **0.16**, and it is a floor with a reason rather than a
    # currency update: 0.16.0 opened schema 14 with `Run.usage`, two lines of
    # one bill — the target's and the judge's — where before it every provider
    # priced the counts, kept the money on `Response.cost_usd` and dropped the
    # rest. `reason.py` is judged, so its judge spends more than its target
    # does, and under `<0.16` this repository could not state that number: it
    # had to be reconstructed by multiplying calls by an observed price. A
    # number the document carries beats a number somebody multiplied.
    #
    # It lands on 0.18 rather than 0.16 because `digline-anthropic` 0.5.3
    # requires `digline>=0.17`, and the plugin is not worth holding back to
    # keep a floor we only needed a minimum of.
    "digline>=0.18,<0.19",
    # No longer test-only: `brief.BriefJudge` is a `digline.targets.JudgeBase`
    # priced from the plugin's `ANTHROPIC_PRICING`, so the application imports
    # the provider package too — not only the suite.
    "digline-anthropic>=0.5.3,<0.6",
]

# Not a dependency of the digest. `digline-mcp` pulls `mcp>=2.2,<3`, and the
# morning run has no business carrying an MCP stack — but `.mcp.json` names
# `uv run digline-mcp`, so it has to be installed somewhere. A dev group is
# that somewhere. Note `uv sync` installs it by default, CI included; that is
# the price of the server being one command away rather than one README
# paragraph away.
[dependency-groups]
dev = [
    "digline-mcp>=0.1.1,<0.2",
]
