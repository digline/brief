name: check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday, 06:00 UTC. The judge does not change on its own; the model behind
    # it does. The run nobody triggered is the one that notices.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Every push. Costs nothing, because the provider is faked.
  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      # From PyPI, like anyone else cloning this.
      - run: uv sync

      - name: The whole cycle, with the judge faked
        env:
          BRIEF_FAKE_JUDGE: "1"
          # A scratch root, and this is the point: the committed baseline was
          # produced by the real model, and the fake is a different judge. Its
          # numbers are only good for proving that the suite loads, the prompts
          # compose, the assertions evaluate and a comparison comes out — so
          # they are promoted and compared against themselves, over here, where
          # they cannot be mistaken for a measurement.
          ROOT: ${{ runner.temp }}/digline
        run: |
          uv run digline run     --suite suite.py --root "$ROOT"
          uv run digline promote --suite suite.py --root "$ROOT" --run latest
          uv run digline compare --suite suite.py --root "$ROOT" --run latest --locale en

      # The second suite, and the second fake: `FakeClaimAnthropic` stands in
      # for the instrument, not for the thing measured. Its sentence is mostly
      # about its own bookkeeping, so it scores low by construction and the run
      # is mostly red — which is the correct answer to the question asked, and
      # harmless here because the reference it is compared against is itself.
      - name: The reason suite, both providers faked
        env:
          BRIEF_FAKE_JUDGE: "1"
          ROOT: ${{ runner.temp }}/digline
        run: |
          uv run digline run     --suite about.py --root "$ROOT"
          uv run digline promote --suite about.py --root "$ROOT" --run latest
          uv run digline compare --suite about.py --root "$ROOT" --run latest --locale en

  # The real thing, against the committed baseline. It spends, so it runs on
  # the schedule and when asked — never on a push.
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync

      # A fork has no key, and a job that fails for that reason teaches nobody
      # anything.
      - id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No ANTHROPIC_API_KEY configured — skipping the live run."
          fi

      # Both runs before either gate, on purpose. `compare` exits 1 on a
      # regression and a failed step ends the job, so gating between the two
      # runs would mean a bad morning for the score cost us the measurement of
      # the sentence — the expensive half, and the one we would want most.
      - if: steps.key.outputs.present == 'true'
        run: uv run digline run --suite suite.py

      # The sentence. Two models per case here — the target being measured and
      # the claim judge measuring it — so it costs about $0.19 against
      # `suite.py`'s $0.07.
      - if: steps.key.outputs.present == 'true'
        run: uv run digline run --suite about.py

      # The gates. Exit 1 if anything got worse than the committed baseline.
      - if: steps.key.outputs.present == 'true'
        run: uv run digline compare --suite suite.py --run latest --locale en

      - if: steps.key.outputs.present == 'true'
        run: uv run digline compare --suite about.py --run latest --locale en
